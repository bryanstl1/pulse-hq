async function refreshCrmData(){
    if(!client||!state.session||state.crmLoading)return;
    state.crmLoading=true;
    try{
      const [org,opp,contacts,activities,docs]=await Promise.all([
        client.from('pulse_crm_organizations').select('*').order('updated_at',{ascending:false}).limit(100),
        client.from('pulse_crm_opportunities').select('*').order('updated_at',{ascending:false}).limit(120),
        client.from('pulse_crm_contacts').select('*').order('created_at',{ascending:false}).limit(150),
        client.from('pulse_crm_activities').select('*').order('happened_at',{ascending:false}).limit(300),client.from('pulse_crm_documents').select('*').order('created_at',{ascending:false}).limit(80)
      ]);
      const failure=[org,opp,contacts,activities,docs].find(x=>x.error);
      if(failure)throw new Error(failure.error.message);
      state.crmOrgs=org.data||[];state.crmOpps=opp.data||[];
      state.crmContacts=contacts.data||[];state.crmActivities=activities.data||[];state.crmDocs=docs.data||[];
      if(!state.crmOpps.some(x=>x.id===state.crmSelected))state.crmSelected=state.crmOpps[0]?.id||'';
      if(state.crmSelected&&!state.crmEditId){
        const current=state.crmOpps.find(o=>o.id===state.crmSelected);
        if(current){state.crmEditId=current.id;state.crmEditStage=current.stage;state.crmEditPriority=current.priority;state.crmEditNextAction=current.next_action||'';state.crmEditDue=current.follow_up_date||'';}
      }
      if(!state.crmNewOppOrg||!state.crmOrgs.some(x=>x.id===state.crmNewOppOrg))state.crmNewOppOrg=state.crmOrgs[0]?.id||'';
      state.crmReady=true;
    }catch(error){state.crmNotice='No se pudo consultar CRM: '+String(error.message||error).slice(0,180);state.crmReady=true;}
    finally{state.crmLoading=false;if(state.page==='crm')render();}
  }

  async function crmAction(action){
    if(!client||!state.session||state.crmBusy)return;
    const userId=state.session.user.id;
    const selected=state.crmOpps.find(x=>x.id===state.crmSelected)||state.crmOpps[0];
    state.crmBusy=true;state.crmNotice='';
    try{
      if(action==='crm-add-org'){
        const name=state.crmOrgName.trim(),website=state.crmOrgWebsite.trim();
        if(name.length<2||name.length>140)throw new Error('Nombre de empresa: entre 2 y 140 caracteres.');
        if(website&&!/^https:\/\/\S+$/i.test(website))throw new Error('El sitio web debe comenzar con https://');
        const {error}=await client.from('pulse_crm_organizations').insert({user_id:userId,name,website:website||null,industry:'',notes:'Prospecto agregado por el CEO; datos pendientes de verificación.'});
        if(error)throw error;
        state.crmOrgName='';state.crmOrgWebsite='';
      }else if(action==='crm-add-opp'){
        const orgId=state.crmNewOppOrg||state.crmOrgs[0]?.id;
        const title=state.crmNewOppTitle.trim(),description=state.crmNewOppGoal.trim(),linkedMission=state.crmNewOppMission||null;
        if(!orgId||title.length<5||title.length>180)throw new Error('Elige empresa y un nombre de oportunidad de 5 a 180 caracteres.');
        const {error}=await client.from('pulse_crm_opportunities').insert({user_id:userId,organization_id:orgId,mission_id:linkedMission,title,description,stage:'research',next_action:'Validar la oportunidad, fuentes y vías de contacto antes de actuar.'});
        if(error)throw error;
        state.crmNewOppTitle='';state.crmNewOppGoal='';state.crmNewOppMission='';
      }else if(action==='crm-save'){
        if(!selected)throw new Error('Selecciona una oportunidad.');
        const stage=String($('#crmStage')?.value||state.crmEditStage);
        const priority=String($('#crmPriority')?.value||state.crmEditPriority);
        const nextAction=String($('#crmNextAction')?.value??state.crmEditNextAction).trim();
        const followUp=String($('#crmDue')?.value??state.crmEditDue).trim();
        if(nextAction.length>2000||!CRM_STAGES.some(s=>s[0]===stage))throw new Error('La etapa o siguiente acción no son válidas.');
        const {error}=await client.from('pulse_crm_opportunities').update({stage,priority,next_action:nextAction,follow_up_date:followUp||null,updated_at:new Date().toISOString()}).eq('id',selected.id).eq('user_id',userId);
        if(error)throw error;
        if(stage!==selected.stage){
          const {error:activityError}=await client.from('pulse_crm_activities').insert({user_id:userId,opportunity_id:selected.id,kind:'note',summary:'El CEO cambió la etapa de '+crmStageName(selected.stage)+' a '+crmStageName(stage)+'. Cambio manual; no implica comunicaciones externas.'});
          if(activityError)state.crmNotice='Cambio guardado, pero no se pudo registrar la nota de etapa.';
        }
        state.crmEditId='';state.crmEditNextAction='';
      }else if(action==='crm-add-contact'){
        if(!selected)throw new Error('Selecciona una oportunidad.');
        const name=state.crmContactName.trim(),role=state.crmContactRole.trim(),email=state.crmContactEmail.trim(),url=state.crmContactSource.trim();
        if(name.length<2||name.length>150)throw new Error('Escribe el nombre real de la persona.');
        if(url&&!/^https:\/\/\S+$/i.test(url))throw new Error('La fuente debe ser una URL https://');
        const {error}=await client.from('pulse_crm_contacts').insert({user_id:userId,organization_id:selected.organization_id,full_name:name,job_title:role,email:email||null,public_source_url:url||null,verification:'unverified'});
        if(error)throw error;
        state.crmContactName='';state.crmContactRole='';state.crmContactEmail='';state.crmContactSource='';
      }else if(action==='crm-add-note'){
        if(!selected)throw new Error('Selecciona una oportunidad.');
        const summary=state.crmNote.trim();
        if(summary.length<4||summary.length>2000)throw new Error('La nota debe contener entre 4 y 2000 caracteres.');
        const {error}=await client.from('pulse_crm_activities').insert({user_id:userId,opportunity_id:selected.id,kind:'note',summary});
        if(error)throw error;
        state.crmNote='';
      }else throw new Error('Acción desconocida');
      const warning=state.crmNotice;
      await refreshCrmData();
      state.crmNotice=warning||'Información guardada correctamente en Supabase.';
      toast(state.crmNotice);
    }catch(error){state.crmNotice='No se pudo guardar: '+String(error.message||error).slice(0,190);toast(state.crmNotice);}
    finally{state.crmBusy=false;render();}
  }

    finally{state.missionLoading=false;if(state.page==='ceo'||state.page==='crm'||state.page==='venture')render();}
  }
  async function missionAction(action,id){
    if(state.missionBusy||!client||!state.session)return;
    state.missionBusy=true;
    try{
      const body=action==='create'?{action,title:state.missionTitle.trim(),objective:state.missionGoal.trim()}:{action,missionId:id};
      const {data,error}=await client.functions.invoke('pulse-mission-control',{body});
      if(error){
        let message='';try{const x=await error.context?.json();message=x?.error||'';}catch{}
        throw new Error(message||error.message);
      }
      if(!data?.ok)throw new Error(data?.error||'No se pudo completar la acción');
      state.missionNotice=action==='create'?'Misión creada: los departamentos empezarán a coordinarse automáticamente.':'Estado de misión actualizado.';
      if(action==='create'){state.missionTitle='';state.missionGoal='';state.missionSelected=data.missionId||'';}
      await refreshMissionData();
      toast(state.missionNotice);
    }catch(error){state.missionNotice='Error: '+String(error.message||error).slice(0,160);toast(state.missionNotice);}
    finally{state.missionBusy=false;render();}
  }
  async function refreshScheduleData(){
    if(!client||!state.session||state.scheduleLoading)return;
    state.scheduleLoading=true;
    try{
      const [a,b]=await Promise.all([
        client.from('pulse_schedule_settings').select('enabled,local_hour,objective,timezone').eq('user_id',state.session.user.id).maybeSingle(),
        client.from('pulse_schedule_runs').select('local_day,status,error,started_at').eq('user_id',state.session.user.id).order('started_at',{ascending:false}).limit(4)
      ]);
      if(a.error||b.error)throw new Error(a.error?.message||b.error?.message||'Error al consultar la programación');
      if(a.data){state.scheduleEnabled=Boolean(a.data.enabled);state.scheduleHour=Number(a.data.local_hour);state.scheduleGoal=a.data.objective||state.autoGoal;}
      else {state.scheduleEnabled=false;state.scheduleGoal=state.autoGoal;}
      state.scheduleRuns=b.data||[];
      state.scheduleReady=true;
    }catch(error){state.scheduleNotice='No se pudo consultar la programación: '+String(error.message||error).slice(0,135);state.scheduleReady=true;}
    finally{state.scheduleLoading=false;if(state.page==='ceo')render();}
  }
  async function saveDailySchedule(enabled){
    if(!client||!state.session||state.scheduleSaving)return;
    const goal=String($('#scheduleGoal')?.value||state.scheduleGoal||state.autoGoal).trim();
    const hour=Number($('#scheduleHour')?.value??state.scheduleHour);
    if(goal.length<20||goal.length>1500||!Number.isInteger(hour)||hour<0||hour>23){state.scheduleNotice='Escribe un objetivo de 20 a 1500 caracteres y elige una hora válida.';render();return;}
    state.scheduleGoal=goal;state.scheduleHour=hour;state.scheduleSaving=true;state.scheduleNotice='';
    try{
      const {error}=await client.from('pulse_schedule_settings').upsert({
        user_id:state.session.user.id,enabled,local_hour:hour,
        timezone:'America/Mexico_City',objective:goal,updated_at:new Date().toISOString()
      },{onConflict:'user_id'});
      if(error)throw error;
      state.scheduleEnabled=enabled;
      state.scheduleNotice=enabled?'Programación guardada. La próxima campaña se preparará a las '+String(hour).padStart(2,'0')+':00, hora de Ciudad de México.':'Programación pausada. No se crearán nuevos ciclos diarios.';
      toast(enabled?'Rutina diaria activada.':'Rutina diaria pausada.');
    }catch(error){state.scheduleNotice='No se pudo guardar: '+String(error.message||error).slice(0,160);}
    finally{state.scheduleSaving=false;render();}
  }
  async function refreshAutoQuota(){if(!client||!state.session||state.autoQuotaLoading)return;state.autoQuotaLoading=true;try{const {data,error}=await client.functions.invoke("pulse-autopilot",{body:{action:"status"}});if(!error&&data?.ok)state.autoQuota=data;}catch{}finally{state.autoQuotaLoading=false;if(state.page==="ceo")render();}}
  async function runAutopilot(){if(state.mode!=='live'||!state.session){toast('Inicia sesión para usar Gemini.');return;}if(state.loading)return;const objective=($('#autoGoal')?.value||state.autoGoal||'').trim();if(objective.length<20||objective.length>1500){state.autoMessage='Escribe un objetivo de 20 a 1500 caracteres.';render();return;}state.autoGoal=objective;state.autoMessage='Ejecutando planificación → creación → supervisión. Consulta los robots mientras trabajan.';state.loading=true;nav('office');toast('Iniciando ciclo real de tres agentes...');const polling=setInterval(refresh,2500);try{const {data,error}=await client.functions.invoke('pulse-autopilot',{body:{objective}});if(error){let message='';try{const payload=await error.context?.json();message=typeof payload?.error==='string'?payload.error:'';}catch{}throw new Error(message||error.message);}if(!data?.ok)throw new Error(data?.error||'La ejecución no terminó.');await refresh();state.autoMessage='Ciclo completado y guardado. Revisa el entregable final antes de aprobarlo.';nav('approvals');refreshAutoQuota();toast('Tres etapas completadas. Revisión pendiente.');}catch(err){state.autoMessage='No se completó el ciclo: '+String(err.message||err).slice(0,240);await refresh();nav('ceo');refreshAutoQuota();toast('Consulta el diagnóstico del piloto en Modo CEO.');}finally{clearInterval(polling);state.loading=false;render();}}
  async function submit(){const field=$('#command'),value=field?.value.trim();if(!value){toast('Escribe una instrucción.');return;}if(value.length>2000){toast('La instrucción supera el límite.');return;}if(state.mode==='live'&&!ACTIVE.has(state.department)){toast('Este departamento no está activo todavía; no se ejecutó IA.');return;}if(state.mode==='demo'){state.tasks.unshift({id:'demo-'+Date.now(),department:DEPTS[state.department][0],instruction:value,status:'demo',created_at:new Date().toISOString()});save();nav('tasks');toast('Tarea de prueba guardada sin ejecución real.');return;}if(state.loading)return;state.loading=true;nav('office');toast('Agente solicitado. Abre la oficina para observar el estado real.');const refreshTimer=setInterval(refresh,2500);try{const {data,error}=await client.functions.invoke('pulse-run',{body:{department:DEPTS[state.department][0],instruction:value}});if(error){let details='';try{const body=await error.context?.json();details=typeof body?.error==='string'?body.error:'';}catch{}throw new Error(details||error.message);}if(!data?.ok)throw new Error(data?.error||'No se pudo completar');await refresh();nav('tasks');toast('Ejecución registrada. Revisa el resultado.');}catch(err){toast('No se pudo ejecutar: '+String(err.message||err).slice(0,180));}finally{clearInterval(refreshTimer);state.loading=false;render();}}
  async function resolveApproval(id,choice){if(state.mode==='demo'){state.approvals=state.approvals.map(a=>String(a.id)===id?{...a,status:choice}:a);save();render();toast('Decisión registrada solamente en esta demo.');return;}const {error}=await client.from('pulse_approvals').update({status:choice}).eq('id',id).eq('status','pending');if(error){toast('No se pudo guardar la revisión.');return;}await refresh();toast('Revisión guardada. No se ejecutaron acciones externas.');}
  $('#app').addEventListener('input',ev=>{if(ev.target?.id==='autoGoal')state.autoGoal=ev.target.value;if(ev.target?.id==='missionTitle')state.missionTitle=ev.target.value;const crmInputs={crmOrgName:'crmOrgName',crmOrgWebsite:'crmOrgWebsite',crmNewOppTitle:'crmNewOppTitle',crmNewOppGoal:'crmNewOppGoal',crmContactName:'crmContactName',crmContactRole:'crmContactRole',crmContactEmail:'crmContactEmail',crmContactSource:'crmContactSource',crmNote:'crmNote',crmNextAction:'crmEditNextAction',crmDue:'crmEditDue',crmStage:'crmEditStage',crmPriority:'crmEditPriority',crmNewOppOrg:'crmNewOppOrg',crmNewOppMission:'crmNewOppMission'};if(crmInputs[ev.target?.id])state[crmInputs[ev.target.id]]=ev.target.value;if(ev.target?.id==='missionGoal')state.missionGoal=ev.target.value;if(ev.target?.id==='ventureBrand')state.ventureBrand=ev.target.value.slice(0,31);if(ev.target?.id==='scheduleGoal')state.scheduleGoal=ev.target.value;if(ev.target?.id==='scheduleHour')state.scheduleHour=Number(ev.target.value);});
  $('#app').addEventListener('change',ev=>{const fields={crmStage:'crmEditStage',crmPriority:'crmEditPriority',crmDue:'crmEditDue',crmNewOppOrg:'crmNewOppOrg',crmNewOppMission:'crmNewOppMission',ventureSelect:'ventureSelected'};if(fields[ev.target?.id])state[fields[ev.target.id]]=ev.target.value;});$('#app').addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b||!$('#app').contains(b))return;if(b.dataset.open!==undefined){nav('department',Number(b.dataset.open));return;}if(b.dataset.nav){nav(b.dataset.nav);if(b.dataset.nav==='ceo'){refreshAutoQuota();refreshScheduleData();refreshMissionData();}if(b.dataset.nav==='crm'){refreshCrmData();refreshMissionData();}if(b.dataset.nav==='venture'){refreshVenture();refreshMissionData();}if(b.dataset.nav==='deliverables')refreshDeliverables();if(b.dataset.nav==='approvals')refresh();return;}if(b.dataset.task){state.taskId=b.dataset.task;nav('task');return;}if(b.dataset.deliveryPng){await deliveryPNG(b.dataset.deliveryPng);return;}if(b.dataset.ventureImage!==undefined){await ventureExport('png',Number(b.dataset.ventureImage));return;}if(b.dataset.ventureMission){state.missionSelected=b.dataset.ventureMission;nav('ceo');refreshMissionData();refreshAutoQuota();return;}if(b.dataset.crmSelect){selectCrmOpportunity(b.dataset.crmSelect);return;}if(b.dataset.crmMission){state.missionSelected=b.dataset.crmMission;nav('ceo');refreshMissionData();refreshAutoQuota();return;}if(b.dataset.missionSelect){state.missionSelected=state.missionSelected===b.dataset.missionSelect?'':b.dataset.missionSelect;render();return;}if(b.dataset.missionAction){await missionAction(b.dataset.missionAction,b.dataset.missionId);return;}if(b.dataset.approval){await resolveApproval(b.dataset.approval,b.dataset.choice);return;}switch(b.dataset.action){case 'delivery-refresh':state.deliverySignedAt=0;await refreshDeliverables();break;case 'venture-preview':state.ventureBrand=($('#ventureBrand')?.value||'ESTÉTICA DEMO').slice(0,31);render();break;case 'venture-zip':await ventureExport('zip');break;case 'venture-pdf':await ventureExport('pdf');break;case 'crm-save':case 'crm-add-org':case 'crm-add-opp':case 'crm-add-contact':case 'crm-add-note':await crmAction(b.dataset.action);break;case 'mission-create':state.missionTitle=$('#missionTitle')?.value||state.missionTitle;state.missionGoal=$('#missionGoal')?.value||state.missionGoal;await missionAction('create');break;case 'schedule-save':await saveDailySchedule(true);break;case 'schedule-pause':await saveDailySchedule(false);break;case 'autopilot':await runAutopilot();break;case 'submit':await submit();break;case 'refresh':await refresh();toast('Tareas actualizadas.');break;case 'login':{const email=$('#email')?.value?.trim();if(!email){toast('Escribe tu correo.');return;}const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});toast(error?'No se pudo enviar el enlace: '+error.message:'Revisa tu correo para entrar a PULSE HQ.');break;}case 'logout':await client.auth.signOut();state.session=null;render();break;}});
  async function init(){if(client){const {data,error}=await client.auth.getSession();if(!error){state.session=data.session;client.auth.onAuthStateChange((_event,session)=>{state.session=session;render();if(session)refresh()});if(state.session)await refresh();client.channel('pulse-live').on('postgres_changes',{event:'*',schema:'public',table:'pulse_tasks'},()=>{if(state.session)refresh()}).on('postgres_changes',{event:'*',schema:'public',table:'pulse_approvals'},()=>{if(state.session)refresh()}).subscribe();setInterval(()=>{if(state.session&&!state.loading){refresh();if(state.page==='ceo')refreshMissionData();if(state.page==='crm')refreshCrmData();if(state.page==='venture')refreshVenture();if(state.page==='deliverables')refreshDeliverables();}},20000);}}render();}
  init();
})();
</script></body></html>
