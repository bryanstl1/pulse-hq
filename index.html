  const scene = (d,big=false) => `<div class="${big?'big-scene':''}" data-state="${isRunning(d[0])?'running':isWaiting(d[0])?'waiting':'idle'}" style="--tone:${d[1]}"><div class="iso"><div class="wall w1"></div><div class="wall w2"></div><div class="floor"></div><div class="monitor"></div><div class="desk"></div><div class="bot"></div><div class="bot second"></div><div class="bot third"></div></div></div>`;
  function room(d,i){const run=isRunning(d[0]),waiting=isWaiting(d[0]);return `<button class="room" data-open="${i}" data-state="${run?'running':waiting?'waiting':'idle'}" style="--tone:${d[1]}" aria-label="Entrar a ${esc(d[0])}"><span class="room-status ${run?'running':waiting?'waiting':''}">${run?'● Ejecutando':waiting?'● Revisar':'○ En espera'}</span>${scene(d)}<span class="room-title">${esc(d[0])}</span><span class="room-meta"><span>3 miniagentes</span><span>${taskCount(d[0])} tareas ↗</span></span></button>`;}
  function renderOffice(){const completed=state.tasks.filter(t=>t.status==='completed').length; return `<div class="eyebrow">TU CENTRO DE MANDO</div><h1 class="heading">Oficina viva ✦</h1><p class="desc">Toca un departamento para ver sus miniagentes. Solo animamos el trabajo cuando existe una ejecución real registrada.</p><div class="stats"><div class="stat"><b>10</b><span>Departamentos</span></div><div class="stat tint"><b>${state.tasks.length}</b><span>Tareas ${state.mode==='demo'?'de prueba':'registradas'}</span></div><div class="stat warn"><b>${state.approvals.filter(a=>a.status==='pending').length}</b><span>Por revisar</span></div></div>${section('PLANO DE LA OFICINA','SELECCIONA UNA SALA')}<div class="room-grid">${DEPTS.map(room).join('')}</div><div class="notice quiet-notice">${state.mode==='demo'?'Modo demostración. Los robots están en reposo y las instrucciones se guardan solo en este navegador.':'Sistema conectado. La animación refleja tareas realmente en ejecución.'}</div>`;}
  function renderDepartment(){const d=DEPTS[state.department],enabled=ACTIVE.has(state.department),deptTasks=state.tasks.filter(t=>t.department===d[0]);return `<button class="back" data-nav="office">← Volver a la oficina</button><div class="eyebrow">DEPARTAMENTO ${String(state.department+1).padStart(2,'0')}</div><h1 class="heading" style="font-size:24px">${esc(d[0])}</h1><p class="desc">Conoce a los especialistas y encarga una tarea desde tu iPhone.</p><div class="scene-wrap">${scene(d,true)}<div class="scene-caption"><strong>Equipo de 3 miniagentes</strong><span class="pill ${isRunning(d[0])?'success':''}">${isRunning(d[0])?'En ejecución':'En espera'}</span></div></div>${section('AGENTES INTERNOS','ESTADO VERIFICABLE')}${d[3].map((name,i)=>`<div class="agent"><div class="avatar">🤖</div><div class="grow"><strong>${esc(name)}</strong><small>${enabled?'Preparado para tareas de IA':'Pendiente de activar en fase posterior'}</small></div><span class="tag">${isRunning(d[0])?'● Activo':'○ En reposo'}</span></div>`).join('')}${section('Nueva instrucción',enabled?'PRIMERA FASE':'FASE FUTURA')}<label for="command">Qué quieres que investigue o produzca este equipo</label><textarea id="command" maxlength="2000" placeholder="Ejemplo: investiga festivales de música electrónica en México y prepara oportunidades para colaborar."></textarea><button class="btn main full" data-action="submit" ${state.loading?'disabled':''}>${state.mode==='demo'?'＋ Guardar tarea de prueba':enabled?'▶ Ejecutar tarea con IA':'＋ Registrar tarea pendiente'}</button>${state.mode==='live'&&!enabled?'<div class="notice">Este departamento todavía no tiene motor de IA. Puedes explorar su diseño, pero no se enviarán ejecuciones.</div>':''}${section('Tareas de este departamento',`${deptTasks.length} REGISTRADAS`)}${deptTasks.length?deptTasks.slice(0,10).map(t=>taskMini(t)).join(''): `<div class="empty"><strong>Aún sin tareas</strong>Asigna una instrucción para comenzar.</div>`}`;}
  const taskMini=(t)=> `<div class="card"><div class="row between"><span class="pill ${status(t)[1]}">${status(t)[0]}</span><small class="muted">${dateText(t.created_at)}</small></div><p class="task-text">${esc(t.instruction)}</p>${t.result?`<button class="btn slim" data-task="${esc(t.id)}">Ver resultado ↗</button>`:t.error?`<p style="color:#ffadb0">${esc(t.error)}</p>`:''}</div>`;
  function renderTasks(){return `<div class="eyebrow">EJECUCIONES Y RESULTADOS</div><h1 class="heading">Centro de tareas</h1><p class="desc">Cada resultado se conserva asociado a su instrucción y departamento.</p><button class="btn slim" data-action="refresh" ${state.mode==='demo'?'disabled':''}>↻ Actualizar desde servidor</button>${section('Todas las tareas',`${state.tasks.length} TAREAS`)}${state.tasks.length?state.tasks.map(taskMini).join(''):`<div class="empty"><strong>Sin tareas</strong>Entra en un departamento para crear una instrucción.</div>`}`;}
  function renderTask(){const t=state.tasks.find(t=>String(t.id)===String(state.taskId));if(!t)return renderTasks();return `<button class="back" data-nav="tasks">← Volver a tareas</button><div class="eyebrow">RESULTADO DE AGENTE</div><h1 class="heading" style="font-size:25px">${esc(t.department)}</h1><div class="row between"><span class="pill ${status(t)[1]}">${status(t)[0]}</span><span class="muted">${dateText(t.created_at)}</span></div>${section('Instrucción')}${card(`<p class="task-text">${esc(t.instruction)}</p>`)}${section('Resultado')}${t.result?card(`<div class="task-text">${esc(t.result)}</div>`):`<div class="empty"><strong>Sin resultado todavía</strong>${t.status==='demo'?'Modo demostración: no se ejecutó ningún modelo de IA.':'Actualiza para comprobar el estado.'}</div>`}${Array.isArray(t.sources)&&t.sources.length?`${section('Fuentes consultadas')}<div class="card"><ul class="sources">${t.sources.filter(s=>/^https:\/\//.test(s.url||s)).map(s=>`<li><a target="_blank" rel="noopener noreferrer" href="${esc(s.url||s)}">${esc(s.title||s.url||s)}</a></li>`).join('')}</ul></div>`:''}`;}
  function renderApprovals(){const pending=state.approvals.filter(a=>a.status==='pending');return `<div class="eyebrow">CONTROL DE DECISIONES</div><h1 class="heading">Aprobaciones</h1><p class="desc">Revisa entregables. Aprobar aquí significa aceptar una revisión, no autorizar envíos ni publicaciones externas.</p>${pending.length?pending.map(a=>`${card(`<div class="row between"><span class="pill warning">Pendiente</span><small class="muted">${dateText(a.created_at)}</small></div><h3>${esc(a.title||'Revisar resultado')}</h3><p>${esc(a.department||'Dirección estratégica')}</p><p>${esc(a.description||'Hay un entregable esperando tu revisión.')}</p><div class="actions"><button class="btn danger" data-approval="${esc(a.id)}" data-choice="rejected">Rechazar</button><button class="btn main" data-approval="${esc(a.id)}" data-choice="approved">Aprobar revisión</button></div>`)}`).join(''):`<div class="empty"><strong>Sin aprobaciones pendientes</strong>Todo revisado por el momento.</div>`}`;}
  function renderCeo(){const counts=['queued','running','completed','failed'].map(s=>state.tasks.filter(t=>t.status===s).length);return `<div class="eyebrow">VISIÓN EJECUTIVA</div><h1 class="heading">Modo CEO</h1><p class="desc">Una lectura clara del estado operativo de PULSE HQ.</p><div class="stats"><div class="stat"><b>${counts[1]}</b><span>Ejecutando</span></div><div class="stat tint"><b>${counts[2]}</b><span>Completadas</span></div><div class="stat warn"><b>${state.approvals.filter(a=>a.status==='pending').length}</b><span>Por aprobar</span></div></div>${card(`<h3>Estado de conexión</h3><p>${state.mode==='demo'?'Demo local. No se han conectado agentes IA, cuentas ni servicios.':'Conexión de Supabase configurada. Las ejecuciones requieren que la función y la clave privada de IA estén operativas.'}</p><div class="row between"><span class="muted">Motor de trabajo</span><span class="pill ${state.mode==='demo'?'off':'success'}">${state.mode==='demo'?'No conectado':'Configurado'}</span></div>`)}${section('Prioridades')}${card(`<h3>Activar los primeros equipos</h3><p>01 · Dirección estratégica<br>02 · Eventos y experiencias<br>03 · Producción de contenido</p>`)}${section('Otros siete departamentos')}${card(`<p>Están presentes en la oficina y esperan sus propias integraciones, permisos y flujos.</p>`)}${state.mode==='live'?'<button class="btn slim" data-action="logout">Cerrar sesión</button>':''}`;}
  function renderAuth(){return `<section class="auth"><div class="auth-logo">⬡</div><h1>PULSE HQ</h1><p>Tu oficina privada de agentes IA.<br>Accede mediante un enlace seguro enviado a tu correo.</p><label for="email">Correo electrónico</label><input type="email" id="email" autocomplete="email" placeholder="tu@correo.com"><button class="btn main full" data-action="login">Enviar enlace de acceso</button><div class="notice quiet-notice">El acceso requiere configurar Supabase Auth y autorizar la URL de esta aplicación. Nunca pegues claves secretas aquí.</div></section>`;}
  function render(){const label=$('#modeLabel');label.textContent=state.mode==='demo'?'MODO DEMO':state.session?'EN LÍNEA':'ACCESO PRIVADO';label.classList.toggle('real',state.mode==='live'&&Boolean(state.session));$('#nav').style.display=state.mode==='live'&&!state.session?'none':'';$('#content').innerHTML=state.mode==='live'&&!state.session?renderAuth():state.page==='office'?renderOffice():state.page==='department'?renderDepartment():state.page==='tasks'?renderTasks():state.page==='task'?renderTask():state.page==='approvals'?renderApprovals():renderCeo();$('#nav').innerHTML=[['office','⌂','Oficina'],['tasks','▤','Tareas'],['approvals','✓','Revisar'],['ceo','◈','Modo CEO']].map(([id,ic,label])=>`<button class="tab ${state.page===id||id==='office'&&state.page==='department'||id==='tasks'&&state.page==='task'?'active':''}" data-nav="${id}"><span class="symbol">${ic}</span>${label}</button>`).join('');}
  async function refresh(){if(!client||!state.session)return;const [tasks,approvals]=await Promise.all([client.from('pulse_tasks').select('*').order('created_at',{ascending:false}).limit(100),client.from('pulse_approvals').select('*').order('created_at',{ascending:false}).limit(100)]);if(tasks.error||approvals.error){toast('No se pudo consultar la base de datos. Revisa la configuración.');return;}state.tasks=tasks.data||[];state.approvals=approvals.data||[];render();}
  async function submit(){const field=$('#command'),value=field?.value.trim();if(!value){toast('Escribe una instrucción.');return;}if(value.length>2000){toast('La instrucción supera el límite.');return;}if(state.mode==='live'&&!ACTIVE.has(state.department)){toast('Este departamento no está activo todavía; no se ejecutó IA.');return;}if(state.mode==='demo'){state.tasks.unshift({id:'demo-'+Date.now(),department:DEPTS[state.department][0],instruction:value,status:'demo',created_at:new Date().toISOString()});save();nav('tasks');toast('Tarea de prueba guardada sin ejecución real.');return;}if(state.loading)return;state.loading=true;nav('office');toast('Agente solicitado. Abre la oficina para observar el estado real.');const refreshTimer=setInterval(refresh,2500);try{const {data,error}=await client.functions.invoke('pulse-run',{body:{department:DEPTS[state.department][0],instruction:value}});if(error){let details='';try{const body=await error.context?.json();details=typeof body?.error==='string'?body.error:'';}catch{}throw new Error(details||error.message);}if(!data?.ok)throw new Error(data?.error||'No se pudo completar');await refresh();nav('tasks');toast('Ejecución registrada. Revisa el resultado.');}catch(err){toast('No se pudo ejecutar: '+String(err.message||err).slice(0,180));}finally{clearInterval(refreshTimer);state.loading=false;render();}}
  async function resolveApproval(id,choice){if(state.mode==='demo'){state.approvals=state.approvals.map(a=>String(a.id)===id?{...a,status:choice}:a);save();render();toast('Decisión registrada solamente en esta demo.');return;}const {error}=await client.from('pulse_approvals').update({status:choice}).eq('id',id).eq('status','pending');if(error){toast('No se pudo guardar la revisión.');return;}await refresh();toast('Revisión guardada. No se ejecutaron acciones externas.');}
  $('#app').addEventListener('click',async ev=>{const b=ev.target.closest('button');if(!b||!$('#app').contains(b))return;if(b.dataset.open!==undefined){nav('department',Number(b.dataset.open));return;}if(b.dataset.nav){nav(b.dataset.nav);return;}if(b.dataset.task){state.taskId=b.dataset.task;nav('task');return;}if(b.dataset.approval){await resolveApproval(b.dataset.approval,b.dataset.choice);return;}switch(b.dataset.action){case 'submit':await submit();break;case 'refresh':await refresh();toast('Tareas actualizadas.');break;case 'login':{const email=$('#email')?.value?.trim();if(!email){toast('Escribe tu correo.');return;}const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname,shouldCreateUser:false}});toast(error?'No se pudo enviar el enlace: '+error.message:'Revisa tu correo para entrar a PULSE HQ.');break;}case 'logout':await client.auth.signOut();state.session=null;render();break;}});
  async function init(){if(client){const {data,error}=await client.auth.getSession();if(!error){state.session=data.session;client.auth.onAuthStateChange((_event,session)=>{state.session=session;render();if(session)refresh()});if(state.session)await refresh();client.channel('pulse-live').on('postgres_changes',{event:'*',schema:'public',table:'pulse_tasks'},()=>{if(state.session)refresh()}).on('postgres_changes',{event:'*',schema:'public',table:'pulse_approvals'},()=>{if(state.session)refresh()}).subscribe();setInterval(()=>{if(state.session&&!state.loading)refresh()},20000);}}render();}
  init();
})();
</script></body></html>
